plugins { id 'com.android.application' }

android {
    namespace 'com.solarnet.attendance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solarnet.attendance'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def store = System.getenv('SOLARNET_ANDROID_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('SOLARNET_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SOLARNET_ANDROID_KEY_ALIAS') ?: 'solarnet-attendance'
                keyPassword System.getenv('SOLARNET_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
