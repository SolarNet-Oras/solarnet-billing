server {
    listen 80 default_server;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 100M;
    server_tokens off;

    # Docker service IPs change whenever a container is recreated. Resolve the
    # PHP-FPM service through Docker DNS instead of pinning the address that
    # existed when nginx first started.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $php_fpm_backend backend:9000;
        fastcgi_pass $php_fpm_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
