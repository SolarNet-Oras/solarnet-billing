##
# Production docker-compose for Solarnet ISP Billing
# Deploy target: Hetzner VPS (or any Linux host with Docker)
#
# Usage:
#   1. cp .env.production.example .env
#   2. Edit .env and set CUSTOMER_DOMAIN, ADMIN_DOMAIN, LEGACY_ADMIN_DOMAIN,
#      DB_PASSWORD, APP_KEY, and JWT_SECRET
#   3. docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Services:
#   caddy    -> :80/:443 (auto HTTPS, reverse proxy)
#   frontend -> React SPA
#   backend  -> Laravel API (php-fpm + nginx)
#   worker   -> queue worker (php artisan queue:work)
#   cron     -> scheduler (php artisan schedule:work)
#   postgres -> PostgreSQL 16
#   redis    -> Redis 7
#   freeradius -> optional, isolated RADIUS service (profile: freeradius)
##

name: solarnet

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LEGACY_ADMIN_DOMAIN: ${LEGACY_ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks: [edge]
    depends_on: [frontend, backend-nginx]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Empty in production: the SPA calls /api on the host it was opened on.
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [edge]

  backend-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../backend:/var/www:ro
      - backend_storage:/var/www/storage
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, internal]
    depends_on: [backend]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    volumes:
      - ../backend:/var/www
      # Read-only source mount for the super-admin AI code-review tools.
      - ../frontend:/var/www/frontend:ro
      - backend_storage:/var/www/storage
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${ADMIN_DOMAIN}
      CUSTOMER_PORTAL_URL: https://${CUSTOMER_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CORS_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN},https://${CUSTOMER_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${ADMIN_DOMAIN},${CUSTOMER_DOMAIN}
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      MAIL_EHLO_DOMAIN: ${ADMIN_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2", "--timeout=90"]
    volumes:
      - ../backend:/var/www
      - backend_storage:/var/www/storage
    env_file: .env
    environment:
      APP_ENV: production
      APP_URL: https://${ADMIN_DOMAIN}
      CUSTOMER_PORTAL_URL: https://${CUSTOMER_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  cron:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ../backend:/var/www
      - backend_storage:/var/www/storage
    env_file: .env
    environment:
      APP_ENV: production
      APP_URL: https://${ADMIN_DOMAIN}
      CUSTOMER_PORTAL_URL: https://${CUSTOMER_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  # Off by default. This service is intentionally profile-gated and publishes
  # only on loopback unless RADIUS_BIND_ADDRESS is explicitly changed for a
  # single, firewall-allow-listed test NAS. It never sits behind Caddy.
  freeradius:
    profiles: ["freeradius"]
    build:
      context: ..
      dockerfile: deploy/freeradius.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RADIUS_SQL_HOST: postgres
      RADIUS_SQL_PORT: 5432
      RADIUS_SQL_DATABASE: ${DB_DATABASE}
      RADIUS_SQL_USERNAME: ${RADIUS_DB_USERNAME:-}
      RADIUS_SQL_PASSWORD: ${RADIUS_DB_PASSWORD:-}
      RADIUS_LOCAL_TEST_SECRET: ${RADIUS_LOCAL_TEST_SECRET:-}
    ports:
      - "${RADIUS_BIND_ADDRESS:-127.0.0.1}:1812:1812/udp"
      - "${RADIUS_BIND_ADDRESS:-127.0.0.1}:1813:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Run manually once after the Laravel migration creates the `radius`
  # schema. It creates only the least-privileged PostgreSQL login/grants used
  # by FreeRADIUS; it does not start RADIUS or modify application data.
  freeradius-bootstrap:
    profiles: ["freeradius-bootstrap"]
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      RADIUS_DB_USERNAME: ${RADIUS_DB_USERNAME:-}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:-}
    volumes:
      - ./freeradius-db-bootstrap.sh:/usr/local/bin/freeradius-db-bootstrap:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/freeradius-db-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  edge:
  internal:

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
