server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never disguise a missing Android package as the React application. The
    # release workflow places the signed artifact at this exact path.
    location = /solarnet-attendance.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="solarnet-attendance.apk"';
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The SPA entry document and service worker must always be revalidated.
    # Hashed files under /assets remain immutable, but caching index.html can
    # leave an installed Attendance kiosk pointing at an obsolete bundle.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    location = /solarnet-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
