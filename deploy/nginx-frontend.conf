server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never disguise a missing Android package as the React application. The
    # release workflow places the signed artifact at this exact path.
    location = /solarnet-attendance.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="solarnet-attendance.apk"';
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
