name: Build SolarNet Attendance Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ATTENDANCE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendance-release.jks"
      - name: Build signed release APK
        working-directory: android-attendance
        env:
          SOLARNET_ANDROID_KEYSTORE: ${{ runner.temp }}/attendance-release.jks
          SOLARNET_ANDROID_STORE_PASSWORD: ${{ secrets.ATTENDANCE_STORE_PASSWORD }}
          SOLARNET_ANDROID_KEY_ALIAS: solarnet-attendance
          SOLARNET_ANDROID_KEY_PASSWORD: ${{ secrets.ATTENDANCE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Name APK
        run: cp android-attendance/app/build/outputs/apk/release/app-release.apk solarnet-attendance.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solarnet-attendance-android
          path: solarnet-attendance.apk
      - name: Upload APK to SolarNet website
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: solarnet-attendance.apk
          target: /var/www/solarnet-billing/frontend/public
      - name: Publish updated frontend image
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/solarnet-billing/deploy
            docker compose -f docker-compose.prod.yml --env-file .env build frontend
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate frontend
