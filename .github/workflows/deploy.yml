name: Deploy SolarNet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /opt/solarnet-billing

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            cd deploy

            docker compose -f docker-compose.prod.yml --env-file .env up -d --build

            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend php artisan migrate --force || true

            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend php artisan optimize:clear || true
