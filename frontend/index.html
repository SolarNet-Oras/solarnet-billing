<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="company-favicon" rel="icon" type="image/svg+xml" href="/solarnet-mark.svg" />
    <link id="company-apple-touch-icon" rel="apple-touch-icon" sizes="192x192" href="/solarnet-company-logo-192.png?v=20260907-official" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5502362453623485"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('solarnet-theme') || localStorage.getItem('theme') || 'system';
          const resolved = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved === 'dark' ? 'dark' : 'light');
          document.documentElement.dataset.theme = preference;
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', resolved === 'dark' ? '#020817' : '#eef2f7');
        } catch (_) { /* use the light CSS defaults if storage is unavailable */ }
      })();
    </script>
    <script>
      (() => {
        const attendance = window.location.hostname.startsWith('attendance.')
          || window.location.pathname === '/attendance-app'
          || window.location.pathname.startsWith('/attendance-app/');
        const staff = window.location.hostname.startsWith('billing.');
        const manifest = document.createElement('link');
        manifest.id = 'application-manifest';
        manifest.rel = 'manifest';
        manifest.href = attendance
          ? '/api/v1/attendance-app/manifest.webmanifest'
          : staff
            ? '/api/v1/admin-app/manifest.webmanifest'
            : '/api/v1/customer-portal/manifest.webmanifest';
        document.head.appendChild(manifest);
      })();
    </script>
    <title>SolarNet Customer App</title>
    <script>
      (() => {
        const isStaffDomain = window.location.hostname.startsWith('billing.');
        const isAttendanceApp = window.location.hostname.startsWith('attendance.')
          || window.location.pathname === '/attendance-app'
          || window.location.pathname.startsWith('/attendance-app/');
        if (isAttendanceApp) {
          document.title = 'SolarNet Attendance';
          const touchIcon = document.getElementById('company-apple-touch-icon');
          if (touchIcon) touchIcon.setAttribute('href', '/solarnet-attendance-icon-192.png?v=20260914-attendance');
          const favicon = document.getElementById('company-favicon');
          if (favicon) {
            favicon.setAttribute('type', 'image/png');
            favicon.setAttribute('href', '/solarnet-attendance-icon-192.png?v=20260914-attendance');
          }
        } else if (isStaffDomain) {
          document.title = 'SolarNet Staff';
        }
        window.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault();
          window.__solarnetInstallPrompt = event;
          window.dispatchEvent(new CustomEvent('solarnet:install-prompt-ready'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f7;color:#0f172a;font-family:Arial,sans-serif;text-align:center">
        <div><strong>Loading SolarNet Customer Portal…</strong><p style="font-size:14px;line-height:1.5">Please wait. If this message remains, update Chrome or Android System WebView and reopen the app.</p></div>
      </div>
    </div>
    <noscript><div style="padding:24px;font-family:Arial,sans-serif">JavaScript must be enabled to use the SolarNet Customer Portal.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
