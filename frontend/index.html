<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="company-favicon" rel="icon" type="image/svg+xml" href="/solarnet-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('solarnet-theme') || localStorage.getItem('theme') || 'system';
          const resolved = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved === 'dark' ? 'dark' : 'light');
          document.documentElement.dataset.theme = preference;
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#020817' : '#eef2f7');
        } catch (_) { /* use the light CSS defaults if storage is unavailable */ }
      })();
    </script>
    <link rel="manifest" href="/api/v1/customer-portal/manifest.webmanifest" />
    <title>SolarNet Customer App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
